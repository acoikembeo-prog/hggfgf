<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>COIKEMFC</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#050914;
    color:#fff;
    overflow:hidden;
}

button{
    border:0;
    cursor:pointer;
    color:white;
    font-weight:bold;
}

.hidden{display:none!important}

/* LOGIN */

#login{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at 50% 20%,#123d69 0,#07101d 45%,#02040a 100%);
    z-index:1000;
}

.login-box{
    width:min(430px,92vw);
    padding:35px;
    border:1px solid #31557d;
    border-radius:24px;
    background:rgba(5,12,25,.88);
    box-shadow:0 0 70px #000;
    text-align:center;
}

.logo{
    font-size:44px;
    font-weight:1000;
    letter-spacing:4px;
    color:#5ee7ff;
    text-shadow:0 0 25px #21b9ff;
}

.subtitle{
    color:#8ea9c5;
    margin:8px 0 28px;
}

.login-btn{
    width:100%;
    padding:15px;
    margin:7px 0;
    border-radius:12px;
    background:#162941;
    border:1px solid #345477;
    transition:.2s;
}

.login-btn:hover{
    transform:translateY(-2px);
    background:#21466b;
}

.login-btn.guest{
    background:linear-gradient(90deg,#087ca5,#15b7d7);
}

/* APP */

#app{
    height:100vh;
    display:grid;
    grid-template-columns:210px 1fr;
    background:
      radial-gradient(circle at 50% 45%,rgba(0,130,180,.13),transparent 35%),
      linear-gradient(#07101b,#03070d);
}

/* SIDEBAR */

.sidebar{
    background:rgba(3,9,17,.95);
    border-right:1px solid #1b3047;
    padding:18px 12px;
    overflow:auto;
}

.side-logo{
    text-align:center;
    font-size:23px;
    font-weight:1000;
    color:#58ddff;
    margin-bottom:18px;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.nav button{
    text-align:left;
    padding:12px 13px;
    border-radius:10px;
    background:transparent;
    color:#91a9bf;
}

.nav button:hover,
.nav button.active{
    background:linear-gradient(90deg,#123554,#0d1e31);
    color:white;
}

.logout{
    margin-top:20px;
    width:100%;
    padding:11px;
    border-radius:10px;
    background:#32151a;
}

/* MAIN */

.main{
    position:relative;
    overflow:auto;
}

.topbar{
    height:70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 25px;
    border-bottom:1px solid #17283b;
    background:rgba(3,8,15,.72);
}

.currency{
    display:flex;
    gap:10px;
}

.money{
    padding:9px 14px;
    background:#102238;
    border:1px solid #264462;
    border-radius:10px;
}

.page{
    padding:25px;
    min-height:calc(100vh - 70px);
}

/* LOBBY */

#home{
    height:calc(100vh - 70px);
    padding:0;
    position:relative;
    overflow:hidden;
}

.stadium{
    position:absolute;
    inset:0;
    background:
radial-gradient(ellipse at 50% 45%,rgba(39,154,185,.30),transparent 38%),
      linear-gradient(180deg,#06101e 0%,#0a2530 52%,#07170e 53%,#0a2414 100%);
}

.stadium:before{
    content:"";
    position:absolute;
    left:10%;
    right:10%;
    top:38%;
    height:42%;
    border:3px solid rgba(111,233,255,.35);
    border-radius:50%;
    transform:perspective(500px) rotateX(55deg);
    box-shadow:0 0 50px rgba(47,205,255,.15);
}

.lights{
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at 12% 18%,#fff 0 2px,transparent 5px),
      radial-gradient(circle at 27% 12%,#fff 0 2px,transparent 5px),
      radial-gradient(circle at 73% 12%,#fff 0 2px,transparent 5px),
      radial-gradient(circle at 88% 18%,#fff 0 2px,transparent 5px);
    animation:lights 2s infinite alternate;
}

@keyframes lights{
    from{opacity:.45}
    to{opacity:1}
}

.lobby-player{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-42%);
    width:170px;
    height:390px;
    animation:breathe 2.5s ease-in-out infinite;
    text-align:center;
}

@keyframes breathe{
    0%,100%{transform:translate(-50%,-42%) translateY(0)}
    50%{transform:translate(-50%,-42%) translateY(-7px)}
}

.player-head{
    width:58px;
    height:58px;
    margin:auto;
    border-radius:50%;
    background:linear-gradient(135deg,#d99c70,#8c5136);
    border:3px solid #222;
}

.player-body{
    width:110px;
    height:150px;
    margin:5px auto 0;
    border-radius:30px 30px 15px 15px;
    background:linear-gradient(120deg,#087ea4,#27c4df,#075172);
    box-shadow:0 0 35px rgba(33,211,255,.3);
}

.player-legs{
    display:flex;
    justify-content:center;
    gap:12px;
}

.leg{
    width:32px;
    height:120px;
    background:#111b2a;
    border-radius:0 0 14px 14px;
}

.captain-name{
    margin-top:8px;
    font-size:18px;
    font-weight:bold;
}

.lobby-card{
    position:absolute;
    left:25px;
    bottom:25px;
    padding:18px;
    width:270px;
    border:1px solid #284862;
    background:rgba(3,11,20,.78);
    border-radius:15px;
}

.start-big{
    position:absolute;
    right:35px;
    bottom:35px;
    padding:18px 35px;
    font-size:20px;
    border-radius:14px;
    background:linear-gradient(90deg,#00a7d4,#42e6ff);
    box-shadow:0 0 30px rgba(35,216,255,.3);
}

/* CARDS */

.card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:15px;
}

.player-card{
    min-height:270px;
    padding:15px;
    border-radius:17px;
    background:linear-gradient(145deg,#172d47,#07101e);
    border:1px solid #315274;
    position:relative;
    overflow:hidden;
}

.player-card:after{
    content:"";
    position:absolute;
    width:150px;
    height:150px;
    background:#29d9ff;
    opacity:.08;
    border-radius:50%;
    right:-50px;
    top:-50px;
}

.ovr{
    font-size:31px;
    font-weight:1000;
    color:#72eaff;
}

.card-name{
    font-size:20px;
    font-weight:bold;
    margin:10px 0;
}

.pos{
color:#8ba7c2;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;
    margin-top:15px;
    font-size:13px;
}

.stat{
    background:#0b1727;
    padding:7px;
    border-radius:6px;
}

/* GENERAL */

h1{
    margin-bottom:7px;
}

.description{
    color:#8099b0;
    margin-bottom:22px;
}

.panel{
    padding:20px;
    background:#091523;
    border:1px solid #1c3852;
    border-radius:15px;
    margin-bottom:18px;
}

.action{
    padding:11px 15px;
    border-radius:9px;
    background:#116f91;
    margin:4px;
}

.action:hover{
    background:#179cc5;
}

.danger{
    background:#76252e;
}

.success{
    background:#19794d;
}

.gold{
    background:#84651a;
}

/* SQUAD */

.pitch{
    max-width:760px;
    height:530px;
    margin:auto;
    position:relative;
    border-radius:30px;
    border:3px solid rgba(255,255,255,.5);
    background:
      linear-gradient(90deg,rgba(255,255,255,.03) 50%,transparent 50%),
      #155d35;
    background-size:100% 100%;
}

.pitch:before{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    bottom:0;
    width:2px;
    background:rgba(255,255,255,.6);
}

.player-dot{
    position:absolute;
    transform:translate(-50%,-50%);
    width:70px;
    text-align:center;
}

.dot{
    width:45px;
    height:45px;
    margin:auto;
    border-radius:50%;
    background:linear-gradient(145deg,#4ce8ff,#087fa2);
    border:3px solid white;
    box-shadow:0 0 15px rgba(0,220,255,.6);
}

.player-dot small{
    display:block;
    background:#06100c;
    border-radius:5px;
    margin-top:3px;
    padding:3px;
}

/* MATCH */

#match{
    position:fixed;
    inset:0;
    background:#07170d;
    z-index:500;
}

.match-field{
    position:absolute;
    inset:70px 30px 100px;
    border:3px solid rgba(255,255,255,.6);
    border-radius:30px;
    background:
      repeating-linear-gradient(90deg,#12622f 0 90px,#155f31 90px 180px);
    overflow:hidden;
}

.match-field:before{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    bottom:0;
    width:3px;
    background:#fff8;
}

.center-circle{
    position:absolute;
    width:150px;
    height:150px;
    border:3px solid #fff8;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

.ball{
    position:absolute;
    width:24px;
    height:24px;
    border-radius:50%;
    background:white;
    box-shadow:0 0 12px white;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:5;
}

.match-player{
    position:absolute;
    width:42px;
    height:42px;
    border-radius:50%;
    border:3px solid white;
    background:#09a7d0;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:11px;
    font-weight:bold;
    z-index:4;
    transition:.15s;
}

.enemy{
    background:#d94747;
}

.scoreboard{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    background:#06101c;
    border:1px solid #3b5b78;
    border-radius:12px;
padding:12px 25px;
    font-size:21px;
    z-index:10;
}

.match-controls{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:8px;
    z-index:20;
}

.control-key{
    padding:9px 13px;
    background:#102438;
    border:1px solid #31506c;
    border-radius:7px;
}

.goal-text{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:80px;
    font-weight:1000;
    color:#fff;
    text-shadow:0 0 30px #00cfff;
    z-index:30;
    opacity:0;
    pointer-events:none;
}

.goal-text.show{
    animation:goal .9s forwards;
}

@keyframes goal{
    0%{opacity:0;transform:scale(.3)}
    40%{opacity:1;transform:scale(1.2)}
    100%{opacity:0;transform:scale(1)}
}

.celebration{
    position:absolute;
    inset:0;
    z-index:29;
    display:flex;
    justify-content:center;
    align-items:center;
    pointer-events:none;
    font-size:25px;
    opacity:0;
}

.celebration.show{
</html>
